<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 11 | Bootstrap Form Controls</title>
    <!-- STEP 1: Attach the Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<!-- STEP 3: Style the BODY background -->
<body class="bg-light">
<!-- STEP 4: Add a page layout container with top and bottom margins -->
<div class="container my-5">
    <!-- STEP 5: Let's use the Bootstrap Grid Layout system - add a row -->
    <div class="row justify-content-center">
        <!-- STEP 6: Now add a column, full width for small screens, a bit narrowor for medium and bigger - plus some other visual refinements -->
        <div class="col-sm-12 col-md-8 bg-white shadow-sm rounded p-4">
            <!-- STEP 7: Add an H2, with a bigger bottom margin class -->
            <h2 class="mb-3">Standard Form Controls</h2>
            <form action="" method="" id="">
                <!-- STEP 8: Construct a text INPUT for full name with appropriate classes -->
                <div class="mb-2">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="First, Last" class="form-control" />
                </div>
                <!-- STEP 9: Build out a new row containing 2 columns -->
                <div class="row mb-3">
                    <!-- STEP 10: Build an Input for email with LABEL (and a note) -->
                    <div class="col-sm-12 col-md-6">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" class="form-control" />
                        <div class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <!-- STEP 11: Build an INPUT for password with LABEL -->
                    <div class="col-sm-12 col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" />
                    </div>
                </div>
                <!-- STEP 12: Create a SELECT element with LABEL -->
                <div class="mb-3">
                    <label for="select" class="form-label">Select Option</label>
                    <select class="form-control" id="select" name="select">
                        <option value="">Choose...</option>
                        <option value="1">Option 1</option>
                        <option value="2">Option 2</option>
                        <option value="3">Option 3</option>
                    </select>
                </div>
                <!-- STEP 13: Create a TEXTAREA element with LABEL -->
                <div class="mb-3">
                    <label for="message" class="form-label">Your Message</label>
                    <textarea class="form-control" id="message" name="message" rows="4" placeholder="Enter your message here..."></textarea>
                </div>
                <!-- STEP 14: Build out an INPUT with add-ons for donation amount -->
                <label for="donation" class="form-label">Donation Amount</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" id="donation" name="donation" placeholder="0.00" />
                    <span class="input-group-text">.00</span>
                </div>
                <!-- STEP 15: Insert a DIV for a collection of input elements, with a LABEL -->
                <div class="mb-3">
                    <label class="form-label d-block">Choose your preferences</label>
                    <!-- STEP 16: Build a checkbox -->
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="checkbox1" name="checkbox1" value="option1">
                        <label class="form-check-label" for="checkbox1">Light Mode</label>
                    
                    <!-- STEP 17a: Build a radio button -->
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio1" name="theme" value="light">
                        <label class="form-check-label" for="radio1">Dark Theme</label>
                    </div>
                    
                    <!-- STEP 17b: Add another radio button -->
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio2" name="theme" value="dark">
                        <label class="form-check-label" for="radio2">Light Theme</label>
                    </div>
                </div>
                    
                
                <!-- STEP 18: Build a toggle switch button -->
                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="toggleSwitch" name="toggleSwitch">
                        <label class="form-check-label" for="toggleSwitch">Enable Notifications</label>
                    
                </div>
                <!-- STEP 19: Assemble a range slider -->
                <div class="mb-3">
                    <label for="rangeSlider" class="form-label">Volume Control</label>
                    <input type="range" class="form-range" id="rangeSlider" name="rangeSlider" min="0" max="100">
                    <div class="form-text">Adjust the volume level</div>
                    
                </div>
                <!-- STEP 20: Craft a file upload widget -->
                <div class="mb-4">
                    <label for="fileUpload" class="form-label">Upload your profile picture</label>
                    <input class="form-control" type="file" id="fileUpload" name="fileUpload">
                </div>
                <!-- STEP 21: Complete the form with a submit BUTTON element -->
                <button type="submit" class="btn btn-primary">Submit</button>
                
            </form>
        </div>
    </div>
</div>
<!-- STEP 2: Attach the Bootstrap JS libraries via CDN as well -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
